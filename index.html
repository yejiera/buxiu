<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>书信索引阁 · 一封永存的信札</title>
  <!-- React & ReactDOM & Babel -->
  <script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.development.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.development.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>
  <!-- lz-string 压缩/解压，让数据可放入 URL -->
  <script src="https://cdn.jsdelivr.net/npm/lz-string@1.5.0/libs/lz-string.min.js"></script>
  <style>
    /* 复古书信暖黄基调 */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #f9f1e0;
      font-family: 'Segoe UI', 'Noto Sans SC', 'Courier New', '华文楷书', 'Georgia', serif;
      overflow-x: hidden;
    }

    ::-webkit-scrollbar {
      width: 6px;
      background: #e4d5b6;
    }
    ::-webkit-scrollbar-thumb {
      background: #b87c4f;
      border-radius: 12px;
    }

    .app {
      background: #fdf8ed;
      min-height: 100vh;
      color: #4a2c1a;
      padding-bottom: 60px;
      position: relative;
    }

    .app::before {
      content: "";
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" opacity="0.06"><path fill="none" d="M0 0 L400 0 L400 300 L0 300 Z" stroke="%238b5a2b" stroke-width="0.5" stroke-dasharray="2 6"/><circle cx="30" cy="40" r="2" fill="%238b5a2b"/><circle cx="150" cy="120" r="1.5" fill="%238b5a2b"/><circle cx="280" cy="210" r="2.2" fill="%238b5a2b"/></svg>');
      background-repeat: repeat;
      pointer-events: none;
      z-index: 0;
    }

    .app > * {
      position: relative;
      z-index: 2;
    }

    /* 头部封套风格 */
    .app-header {
      background: #f3e9ce;
      border-bottom: 3px double #d6b17e;
      padding: 0 28px;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 4px 12px rgba(100, 60, 20, 0.08);
      position: sticky;
      top: 0;
      z-index: 30;
      flex-wrap: wrap;
      gap: 8px;
    }

    .app-logo {
      font-size: 1.3rem;
      font-weight: 600;
      background: linear-gradient(135deg, #b37b48, #7a4316);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      font-family: 'Courier New', '华文楷书', monospace;
      white-space: nowrap;
    }

    .hdr-actions {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    .hdr-btn {
      background: #eedfc7;
      border: 1px solid #c9aa7b;
      color: #5a3a1f;
      padding: 6px 14px;
      border-radius: 30px;
      font-size: 0.75rem;
      cursor: pointer;
      transition: all 0.2s;
      font-weight: 500;
      white-space: nowrap;
    }

    .hdr-btn:hover {
      background: #e2cfaa;
      border-color: #b2713a;
      transform: translateY(-1px);
    }

    .hdr-btn.primary {
      background: #dbb47a;
      border: none;
      color: #2f2418;
      font-weight: bold;
    }

    .share-btn {
      background: #ecd9b4;
      border-color: #cfaa78;
    }

    .nav-tabs {
      display: flex;
      background: #f4ecd9;
      border-radius: 40px;
      padding: 3px;
      gap: 4px;
    }

    .nav-tab {
      padding: 4px 18px;
      border-radius: 30px;
      background: transparent;
      border: none;
      color: #8b6946;
      font-size: 0.8rem;
      cursor: pointer;
      font-family: inherit;
    }

    .nav-tab.active {
      background: #ffe3b5;
      color: #794f26;
      font-weight: 600;
    }

    /* hero 书信区域 */
    .hero {
      padding: 48px 24px 40px;
      text-align: center;
    }

    .hero-title {
      font-size: clamp(2rem, 6vw, 3rem);
      font-weight: 600;
      color: #b46f3a;
      font-family: 'Georgia', '华文楷书', cursive;
    }

    .hero-sub {
      color: #b1875b;
      font-size: 0.9rem;
      border-top: 1px dashed #e1c394;
      display: inline-block;
      padding-top: 8px;
      margin-top: 12px;
    }

    .db-badge {
      background: #f0e3cf;
      border-radius: 40px;
      padding: 6px 18px;
      display: inline-flex;
      gap: 8px;
      font-size: 0.75rem;
      color: #b57a42;
      border: 1px solid #e5cfaa;
      margin-bottom: 24px;
    }

    .db-dot {
      width: 8px;
      height: 8px;
      background: #c2823f;
      border-radius: 50%;
      animation: gentleFade 1.8s infinite;
    }

    @keyframes gentleFade {

      0%,
      100% {
        opacity: 0.4;
      }

      50% {
        opacity: 1;
      }
    }

    .search-wrap {
      max-width: 560px;
      margin: 0 auto 20px;
    }

    .search-bar {
      display: flex;
      background: #fffbf0;
      border: 1px solid #dbbc8c;
      border-radius: 60px;
      overflow: hidden;
      box-shadow: 0 4px 10px rgba(80, 45, 20, 0.05);
    }

    .search-bar:focus-within {
      border-color: #c9995c;
      box-shadow: 0 0 0 3px rgba(201, 128, 62, 0.2);
    }

    .search-input {
      flex: 1;
      background: transparent;
      border: none;
      padding: 12px 20px;
      font-size: 0.95rem;
      color: #4c2f17;
      outline: none;
      font-family: inherit;
    }

    .search-input::placeholder {
      color: #c8ad82;
      font-style: italic;
    }

    .search-btn {
      background: #e7cfaa;
      border: none;
      padding: 0 24px;
      font-weight: bold;
      color: #5e3d1e;
      cursor: pointer;
    }

    .suggestions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-top: 6px;
    }

    .sug-tag {
      background: #f5ebd7;
      border: 1px solid #e0caa3;
      border-radius: 30px;
      padding: 4px 14px;
      font-size: 0.75rem;
      color: #9b6a3b;
      cursor: pointer;
      transition: 0.15s;
    }

    .sug-tag:hover {
      background: #e7d2af;
      color: #7a4a22;
    }

    .results-area {
      max-width: 1100px;
      margin: 24px auto 0;
      padding: 0 20px;
    }

    .results-hdr {
      font-size: 0.8rem;
      color: #c69660;
      border-left: 3px solid #e2bc82;
      padding-left: 12px;
      margin-bottom: 24px;
    }

    .results-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
      gap: 28px;
    }

    /* 卡片通用 */
    .rc {
      position: relative;
      background: #fffef5;
      border-radius: 18px;
      box-shadow: 0 12px 24px -12px rgba(70, 35, 10, 0.2);
      transition: transform 0.2s, box-shadow 0.2s;
      border: 1px solid #eedbba;
      overflow: hidden;
    }

    .rc:hover {
      transform: translateY(-5px);
      box-shadow: 0 20px 28px -12px rgba(100, 55, 20, 0.28);
    }

    .del-btn {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #f0e2cf;
      border: 1px solid #dbba92;
      color: #bc7f4b;
      font-size: 0.8rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 20;
      transition: 0.2s;
    }

    .del-btn:hover {
      background: #f1cfaa;
      color: #b33e1c;
    }

    .rc-header {
      padding: 18px 18px 8px;
    }

    .rc-tag {
      display: inline-block;
      font-size: 0.65rem;
      padding: 2px 12px;
      border-radius: 24px;
      background: #f4e5cf;
      color: #bd844d;
      margin-bottom: 10px;
    }

    .rc-title {
      font-size: 1.05rem;
      font-weight: 600;
      color: #785f3a;
    }

    .rc-desc {
      font-size: 0.7rem;
      color: #b9936b;
      margin-top: 4px;
      font-style: italic;
    }

    /* 图片卡片：信封拆开 & 图片抽出 */
    .img-wrap {
      position: relative;
      margin: 0 16px 12px 16px;
      border-radius: 12px;
      overflow: hidden;
      background: #f5ebd7;
      aspect-ratio: 4 / 3;
    }

    .envelope-flap {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 55%;
      background: linear-gradient(145deg, #f9efdf, #efdfc1);
      border-bottom: 2px solid #e6cd9f;
      transform-origin: top;
      z-index: 12;
      pointer-events: none;
      border-radius: 12px 12px 0 0;
      animation: tearFlap 0.5s ease-out forwards;
    }

    @keyframes tearFlap {
      0% {
        transform: rotateX(0deg);
        opacity: 1;
      }

      70% {
        transform: rotateX(-95deg);
        opacity: 0.8;
      }

      100% {
        transform: rotateX(-95deg);
        opacity: 0;
        visibility: hidden;
      }
    }

    .img-envelope img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      animation: photoExtract 0.5s 0.12s forwards;
      opacity: 0;
    }

    @keyframes photoExtract {
      0% {
        opacity: 0;
        transform: translateY(40px) scale(0.94);
      }

      100% {
        opacity: 1;
        transform: translateY(0px) scale(1);
      }
    }

    /* 文字卡片：信纸展开 */
    .text-card .rc-text {
      margin: 0 16px 16px 16px;
      background: #fef7e8;
      border-radius: 12px;
      padding: 16px;
      font-family: 'Courier New', '华文楷书', monospace;
      font-size: 0.8rem;
      line-height: 1.65;
      color: #5a3d24;
      border: 1px solid #eadbba;
      transform-origin: top;
      animation: letterUnfold 0.55s ease-out forwards;
      max-height: 240px;
      overflow-y: auto;
      white-space: pre-wrap;
    }

    @keyframes letterUnfold {
      0% {
        transform: scaleY(0);
        opacity: 0;
      }

      100% {
        transform: scaleY(1);
        opacity: 1;
      }
    }

    .rc-chips {
      padding: 12px 18px 18px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      border-top: 1px solid #efe0ca;
    }

    .chip {
      background: #faf1e2;
      border-radius: 24px;
      padding: 4px 12px;
      font-size: 0.7rem;
      color: #a36d3e;
      border: 0.5px solid #e1caa5;
    }

    .manage-area {
      max-width: 1100px;
      margin: 32px auto;
      padding: 0 20px;
    }

    .manage-hdr {
      background: #efe0cb99;
      padding: 12px 20px;
      border-radius: 60px;
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 28px;
    }

    .danger-btn,
    .export-btn {
      background: #f2e5d2;
      border: 1px solid #dbbd94;
      padding: 6px 18px;
      border-radius: 40px;
      font-size: 0.75rem;
      cursor: pointer;
      color: #926d42;
    }

    .danger-btn:hover {
      background: #f3ddbc;
      color: #a64823;
    }

    /* 导入弹窗 暖黄 */
    .modal-mask {
      position: fixed;
      inset: 0;
      background: rgba(65, 42, 21, 0.6);
      backdrop-filter: blur(4px);
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal {
      background: #fff8ec;
      border-radius: 28px;
      border: 1px solid #e9cfaa;
      max-width: 660px;
      width: 90%;
      max-height: 85vh;
      overflow: auto;
    }

    .modal-head {
      background: #f4e7d3;
      padding: 14px 20px;
      border-bottom: 2px dotted #ebd3b0;
      display: flex;
      justify-content: space-between;
    }

    .tab-bar {
      display: flex;
      background: #fbefdd;
      padding: 8px 16px 0;
      gap: 8px;
    }

    .tab-btn {
      background: transparent;
      border: none;
      padding: 8px 16px;
      border-radius: 30px 30px 0 0;
      font-size: 0.8rem;
      color: #9c7b54;
      cursor: pointer;
    }

    .tab-btn.active {
      background: #fff2e2;
      color: #bc7a3a;
      font-weight: bold;
      border-bottom: 2px solid #dcac76;
    }

    .tab-body {
      padding: 20px;
    }

    .drop-zone {
      border: 2px dashed #e1c292;
      background: #fef7ea;
      border-radius: 20px;
      padding: 30px;
      text-align: center;
      cursor: pointer;
    }

    .field-input,
    .field-textarea,
    .json-area {
      background: #fffcf3;
      border: 1px solid #ebd6b5;
      border-radius: 20px;
      padding: 10px 14px;
      width: 100%;
      margin-bottom: 8px;
      font-family: inherit;
    }

    .import-btn {
      background: #e2c8a0;
      border: none;
      border-radius: 40px;
      padding: 10px;
      font-weight: bold;
      width: 100%;
      cursor: pointer;
      margin-top: 12px;
    }

    .json-example {
      background: #f2e6d4;
      border-radius: 12px;
      padding: 12px;
      font-size: 0.7rem;
      font-family: monospace;
      margin-bottom: 12px;
    }

    .empty {
      text-align: center;
      padding: 60px 20px;
      color: #cbad82;
      font-style: italic;
    }

    .url-warning {
      background: #f7e9d7;
      border-radius: 20px;
      padding: 6px 12px;
      font-size: 0.7rem;
      color: #b46f3a;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
  </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
  const { useState, useRef, useEffect, useCallback } = React;

  // ---------- 压缩 / 解压，将数据库嵌入 URL ----------
  function compressDB(db) {
    const json = JSON.stringify(db);
    return LZString.compressToEncodedURIComponent(json);
  }

  function decompressDB(compressed) {
    if (!compressed) return null;
    try {
      const json = LZString.decompressFromEncodedURIComponent(compressed);
      if (!json) return null;
      return JSON.parse(json);
    } catch (e) {
      console.warn("解压失败", e);
      return null;
    }
  }

  // 更新 URL 中的 data 参数 (不刷新页面)
  function updateURLWithDB(db) {
    const compressed = compressDB(db);
    const newUrl = new URL(window.location.href);
    newUrl.searchParams.set("data", compressed);
    // 使用 replaceState 避免刷新页面破坏状态
    window.history.replaceState({ dbCompressed: compressed }, "", newUrl.toString());
  }

  // 从 URL 读取数据库
  function getDBFromURL() {
    const params = new URLSearchParams(window.location.search);
    const compressed = params.get("data");
    if (compressed) {
      const db = decompressDB(compressed);
      if (db && Array.isArray(db)) return db;
    }
    return null;
  }

  // 本地存储备份 key
  const LOCAL_FALLBACK_KEY = "kw_database_v1";

  function loadInitialDB() {
    // 优先 URL 数据
    const urlDB = getDBFromURL();
    if (urlDB) {
      // 同步至 localStorage 作为缓存
      localStorage.setItem(LOCAL_FALLBACK_KEY, JSON.stringify(urlDB));
      return urlDB;
    }
    // 其次尝试 localStorage
    try {
      const raw = localStorage.getItem(LOCAL_FALLBACK_KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) {}
    return [];
  }

  // 保存到 localStorage 并更新 URL
  function syncDBAndURL(db, setDBFunc) {
    localStorage.setItem(LOCAL_FALLBACK_KEY, JSON.stringify(db));
    updateURLWithDB(db);
    if (setDBFunc) setDBFunc(db);
  }

  // 核心搜索
  function searchDB(db, query) {
    if (!query.trim()) return [];
    const q = query.toLowerCase().trim();
    return db.filter(item => item.keywords.some(kw => kw.toLowerCase().includes(q) || q.includes(kw.toLowerCase())));
  }

  // ---------- 图片卡片 (信封拆开 + 抽出动画) ----------
  function ImageCard({ item, onDelete }) {
    const [loaded, setLoaded] = useState(false);
    return (
      <div className="rc img-card">
        {onDelete && <button className="del-btn" onClick={() => onDelete(item.id)}>✕</button>}
        <div className="rc-header">
          <span className="rc-tag">🖼 旧影·图片</span>
          <h3 className="rc-title">{item.title || "未命名信笺"}</h3>
          {item.desc && <p className="rc-desc">{item.desc}</p>}
        </div>
        <div className="img-wrap img-envelope" style={{ position: 'relative' }}>
          <div className="envelope-flap"></div>
          {!loaded && <div className="img-ph" style={{ position:'absolute', inset:0, display:'flex', alignItems:'center', justifyContent:'center', color:'#cfb284' }}>📜 启封中…</div>}
          <img src={item.content} alt={item.title} onLoad={() => setLoaded(true)} style={{ opacity: loaded ? 1 : 0 }} />
        </div>
        <div className="rc-chips">
          {item.keywords.map(kw => <span key={kw} className="chip">{kw}</span>)}
        </div>
      </div>
    );
  }

  // 文字卡片 (信纸展开)
  function TextCard({ item, onDelete }) {
    return (
      <div className="rc text-card">
        {onDelete && <button className="del-btn" onClick={() => onDelete(item.id)}>✕</button>}
        <div className="rc-header">
          <span className="rc-tag">✍️ 书简·文字</span>
          <h3 className="rc-title">{item.title || "未名尺素"}</h3>
          {item.desc && <p className="rc-desc">{item.desc}</p>}
        </div>
        <pre className="rc-text">{item.content}</pre>
        <div className="rc-chips">
          {item.keywords.map(kw => <span key={kw} className="chip">{kw}</span>)}
        </div>
      </div>
    );
  }

  // 导入面板（保持原有功能，回调会更新全局 db）
  function ImportPanel({ onImport, onClose }) {
    const [tab, setTab] = useState("image");
    const [imgFiles, setImgFiles] = useState([]);
    const [jsonText, setJsonText] = useState("");
    const [jsonErr, setJsonErr] = useState("");
    const [manType, setManType] = useState("image");
    const [manTitle, setManTitle] = useState("");
    const [manDesc, setManDesc] = useState("");
    const [manKw, setManKw] = useState("");
    const [manContent, setManContent] = useState("");
    const [manImgPreview, setManImgPreview] = useState("");
    const imgInputRef = useRef();

    const handleImgFiles = (e) => {
      const files = Array.from(e.target.files);
      const entries = files.map(f => ({ id: crypto.randomUUID(), file: f, preview: URL.createObjectURL(f), title: f.name.replace(/\.[^.]+$/, ""), keywords: "", desc: "" }));
      setImgFiles(prev => [...prev, ...entries]);
    };
    const handleDrop = (e) => {
      e.preventDefault();
      const files = Array.from(e.dataTransfer.files).filter(f => f.type.startsWith("image/"));
      const entries = files.map(f => ({ id: crypto.randomUUID(), file: f, preview: URL.createObjectURL(f), title: f.name.replace(/\.[^.]+$/, ""), keywords: "", desc: "" }));
      setImgFiles(prev => [...prev, ...entries]);
    };
    const updateImgEntry = (id, field, val) => setImgFiles(prev => prev.map(e => e.id === id ? { ...e, [field]: val } : e));
    const removeImgEntry = (id) => setImgFiles(prev => prev.filter(e => e.id !== id));
    const submitImages = async () => {
      if (!imgFiles.length) return;
      const items = await Promise.all(imgFiles.map(entry => new Promise(res => {
        const reader = new FileReader();
        reader.onload = ev => res({ id: entry.id, type: "image", title: entry.title || entry.file.name, desc: entry.desc, keywords: entry.keywords.split(/[,，\s]+/).map(k => k.trim()).filter(Boolean), content: ev.target.result });
        reader.readAsDataURL(entry.file);
      })));
      onImport(items);
      onClose();
    };
    const submitJSON = () => {
      setJsonErr("");
      let parsed;
      try { parsed = JSON.parse(jsonText); } catch (e) { setJsonErr("JSON 格式错误：" + e.message); return; }
      const arr = Array.isArray(parsed) ? parsed : [parsed];
      const items = arr.map((item, i) => ({ id: item.id || crypto.randomUUID(), type: item.type || "text", title: item.title || `条目 ${i + 1}`, desc: item.desc || "", keywords: Array.isArray(item.keywords) ? item.keywords : String(item.keywords || "").split(/[,，\s]+/).filter(Boolean), content: item.content || item.text || "" }));
      onImport(items);
      onClose();
    };
    const handleJSONFile = (e) => { const f = e.target.files[0]; if (f) { const reader = new FileReader(); reader.onload = ev => setJsonText(ev.target.result); reader.readAsText(f); } };
    const handleManImg = (e) => { const f = e.target.files[0]; if (f) { const reader = new FileReader(); reader.onload = ev => { setManContent(ev.target.result); setManImgPreview(ev.target.result); }; reader.readAsDataURL(f); } };
    const submitManual = () => {
      const kws = manKw.split(/[,，\s]+/).map(k => k.trim()).filter(Boolean);
      if (!kws.length) return alert("请至少输入一个关键字");
      if (!manContent) return alert("请填写内容或选择图片");
      onImport([{ id: crypto.randomUUID(), type: manType, title: manTitle || "未命名", desc: manDesc, keywords: kws, content: manContent }]);
      onClose();
    };

    return (
      <div className="modal-mask" onClick={(e) => e.target === e.currentTarget && onClose()}>
        <div className="modal">
          <div className="modal-head"><span className="modal-title">📮 投递新笺</span><button onClick={onClose} style={{ background: 'transparent', border: 'none', fontSize: '1.3rem' }}>✕</button></div>
          <div className="tab-bar">{["image", "json", "manual"].map(k => <button key={k} className={`tab-btn ${tab === k ? "active" : ""}`} onClick={() => setTab(k)}>{k === "image" ? "🖼 批量图片" : k === "json" ? "📦 JSON书信" : "✒️ 手写信笺"}</button>)}</div>
          <div className="tab-body">
            {tab === "image" && (<><div className="drop-zone" onDrop={handleDrop} onDragOver={(e) => e.preventDefault()} onClick={() => imgInputRef.current.click()}><div>📂 拖拽/点击泛黄相片</div><input ref={imgInputRef} type="file" accept="image/*" multiple style={{ display: 'none' }} onChange={handleImgFiles} /></div>{imgFiles.length > 0 && (<div>{imgFiles.map(entry => <div key={entry.id} style={{ display: 'flex', gap: 8, marginBottom: 8, alignItems: 'center' }}><img src={entry.preview} width="60" height="60" style={{ objectFit: 'cover', borderRadius: 8 }} /><div style={{ flex: 1 }}><input placeholder="标题" value={entry.title} onChange={e => updateImgEntry(entry.id, "title", e.target.value)} className="field-input" /><input placeholder="关键字 逗号分隔" value={entry.keywords} onChange={e => updateImgEntry(entry.id, "keywords", e.target.value)} className="field-input" /></div><button onClick={() => removeImgEntry(entry.id)}>✕</button></div>)}<button className="import-btn" onClick={submitImages}>✨ 导入{imgFiles.length}张旧影</button></div>)}</>)}
            {tab === "json" && (<><textarea className="json-area" rows="5" placeholder='粘贴 JSON 格式书信数据...' value={jsonText} onChange={e => { setJsonText(e.target.value); setJsonErr(""); }} /><label className="upload-json-btn" style={{ display: 'inline-block', marginBottom: 8, cursor: 'pointer', background: '#f2e5d2', padding: '6px 16px', borderRadius: 30 }}>📂 上传JSON文件<input type="file" accept=".json" style={{ display: 'none' }} onChange={handleJSONFile} /></label>{jsonErr && <div className="json-err">{jsonErr}</div>}<button className="import-btn" onClick={submitJSON}>📜 解析并导入</button></>)}
            {tab === "manual" && (<><div><label>类型</label><div style={{ display: 'flex', gap: 8, marginBottom: 12 }}><button className={`tt-btn ${manType === "image" ? "active" : ""}`} onClick={() => setManType("image")}>🖼 图片</button><button className={`tt-btn ${manType === "text" ? "active" : ""}`} onClick={() => setManType("text")}>📄 文字</button></div></div><input className="field-input" placeholder="标题" value={manTitle} onChange={e => setManTitle(e.target.value)} /><input className="field-input" placeholder="关键字（逗号/空格）" value={manKw} onChange={e => setManKw(e.target.value)} /><input className="field-input" placeholder="描述" value={manDesc} onChange={e => setManDesc(e.target.value)} />{manType === "image" ? <><input className="field-input" placeholder="图片URL 或 点击上传" value={manContent} onChange={e => { setManContent(e.target.value); setManImgPreview(e.target.value); }} /><label className="upload-json-btn" style={{ cursor: 'pointer', background: '#f2e5d2', padding: '6px 16px', borderRadius: 30, display: 'inline-block' }}>📁 上传图片<input type="file" accept="image/*" style={{ display: 'none' }} onChange={handleManImg} /></label>{manImgPreview && <img src={manImgPreview} style={{ maxHeight: 120, marginTop: 8, borderRadius: 12 }} alt="preview" />}</> : <textarea className="field-textarea" rows="4" placeholder="信的内容..." value={manContent} onChange={e => setManContent(e.target.value)} />}<button className="import-btn" onClick={submitManual}>✉️ 封缄·添加信笺</button></>)}
          </div>
        </div>
      </div>
    );
  }

  // ---------- 主应用 ----------
  function App() {
    const [db, setDB] = useState(() => loadInitialDB());
    const [query, setQuery] = useState("");
    const [results, setResults] = useState([]);
    const [searched, setSearched] = useState(false);
    const [animKey, setAnimKey] = useState(0);
    const [showImport, setShowImport] = useState(false);
    const [view, setView] = useState("search");
    const inputRef = useRef();

    // 每次 db 变动时，同步到 localStorage 和 URL
    useEffect(() => {
      localStorage.setItem(LOCAL_FALLBACK_KEY, JSON.stringify(db));
      updateURLWithDB(db);
    }, [db]);

    // 监听浏览器前进后退，若 URL 参数变化则重新加载数据库
    useEffect(() => {
      const handlePopState = () => {
        const newDB = getDBFromURL();
        if (newDB && JSON.stringify(newDB) !== JSON.stringify(db)) {
          setDB(newDB);
          setResults([]);
          setSearched(false);
        }
      };
      window.addEventListener("popstate", handlePopState);
      return () => window.removeEventListener("popstate", handlePopState);
    }, [db]);

    useEffect(() => {
      if (view === "search") inputRef.current?.focus();
    }, [view]);

    const handleSearch = useCallback((q = query) => {
      setResults(searchDB(db, q));
      setSearched(true);
      setAnimKey(k => k + 1);
    }, [db, query]);

    const handleImport = (items) => {
      setDB(prev => [...prev, ...items]);
    };

    const handleDelete = (id) => {
      if (window.confirm("要烧毁这封信吗？")) setDB(prev => prev.filter(i => i.id !== id));
    };

    const handleExport = () => {
      const data = JSON.stringify(db.map(({ id, type, title, desc, keywords, content }) => ({ id, type, title, desc, keywords, content })), null, 2);
      const blob = new Blob([data], { type: "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "letter_database.json";
      a.click();
      URL.revokeObjectURL(blob);
    };

    const handleClearAll = () => {
      if (window.confirm(`📜 永久清空所有 ${db.length} 封书信？不可逆`)) setDB([]);
    };

    // 复制当前分享链接
    const copyShareLink = async () => {
      const url = window.location.href;
      try {
        await navigator.clipboard.writeText(url);
        alert("✨ 链接已复制！将此链接分享给他人，对方打开即可看到相同的数据并检索。");
      } catch (err) {
        alert("手动复制地址栏链接即可分享。");
      }
    };

    const allKeywords = [...new Set(db.flatMap(i => i.keywords))].slice(0, 20);
    const dataSize = JSON.stringify(db).length;
    const isLarge = dataSize > 18000; // 提示

    return (
      <div className="app">
        <header className="app-header">
          <span className="app-logo">✉️ 信笺·索引阁</span>
          <div className="hdr-actions">
            <div className="nav-tabs">
              <button className={`nav-tab ${view === "search" ? "active" : ""}`} onClick={() => setView("search")}>🔍 拆信检索</button>
              <button className={`nav-tab ${view === "manage" ? "active" : ""}`} onClick={() => setView("manage")}>📬 书信管理</button>
            </div>
            <button className="hdr-btn share-btn" onClick={copyShareLink}>📎 复制分享链接</button>
            <button className="hdr-btn primary" onClick={() => setShowImport(true)}>✍️ + 投递新笺</button>
          </div>
        </header>
        {view === "search" && (
          <>
            <div className="hero">
              <h1 className="hero-title">旧字如晤 · 信中信</h1>
              <p className="hero-sub">一盏黄灯，几行旧句</p>
              <div className="db-badge"><span className="db-dot"></span> 阁中现存 {db.length} 封手札 {isLarge && <span className="url-warning">📜 数据较大，分享链接可能偏长</span>}</div>
              <div className="search-wrap">
                <div className="search-bar">
                  <input ref={inputRef} className="search-input" value={query} onChange={e => setQuery(e.target.value)} onKeyDown={e => e.key === "Enter" && handleSearch()} placeholder="键入想念的关键字…" />
                  <button className="search-btn" onClick={() => handleSearch()}>寻信</button>
                </div>
              </div>
              {allKeywords.length > 0 && <div className="suggestions">{allKeywords.map(kw => <span key={kw} className="sug-tag" onClick={() => { setQuery(kw); handleSearch(kw); }}>{kw}</span>)}</div>}
            </div>
            <div className="results-area">
              {searched && (<div className="results-hdr">{results.length ? `📮 找到 ${results.length} 封 · “${query}”` : `🍂 没有关于 “${query}” 的只言片语`}</div>)}
              {searched && results.length === 0 && (<div className="empty"><div>🔍</div><p>没有寻得「{query}」相关信札<br />{db.length === 0 ? "阁中空空，从右上角投递新笺吧" : "试试其他旧字"}</p></div>)}
              {!searched && db.length === 0 && (<div className="empty"><div>📭</div><p>书信阁初建，点击「投递新笺」藏入回忆<br />导入后链接自动携带数据，复制分享给友人</p></div>)}
              <div className="results-grid" key={animKey}>{results.map(item => item.type === "image" ? <ImageCard key={item.id} item={item} /> : <TextCard key={item.id} item={item} />)}</div>
            </div>
          </>
        )}
        {view === "manage" && (
          <div className="manage-area">
            <div className="manage-hdr"><span>📖 全部信札 · {db.length} 件</span><div><button className="export-btn" onClick={handleExport} disabled={db.length === 0}>⬇ 导出卷宗</button><button className="danger-btn" onClick={handleClearAll} disabled={db.length === 0}>🗑 焚毁全部</button></div></div>
            {db.length === 0 ? <div className="empty"><div>📭</div>暂无书信，请从右上角投递</div> : <div className="results-grid">{db.map(item => item.type === "image" ? <ImageCard key={item.id} item={item} onDelete={handleDelete} /> : <TextCard key={item.id} item={item} onDelete={handleDelete} />)}</div>}
          </div>
        )}
        {showImport && <ImportPanel onImport={handleImport} onClose={() => setShowImport(false)} />}
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
